{{ define "main" }}
  <section class="page-hero">
    <div class="container page-hero__content">
      <div class="breadcrumbs"><a href="{{ "/" | relLangURL }}">{{ i18n "home" }}</a><span>/</span><a href="{{ "products/" | relLangURL }}">{{ i18n "products" }}</a><span>/</span><span>{{ i18n "productCategories" }}</span></div>
      <span class="eyebrow">{{ i18n "products" }}</span>
      <h1>{{ i18n "productCategories" }}</h1>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div class="tag-list">
        {{ range .Data.Terms.Alphabetical }}<a class="tag" href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }} <span>{{ .Count }}</span></a>{{ end }}
      </div>
    </div>
  </section>
{{ end }}
