{{ with .Paginator }}{{ if gt .TotalPages 1 }}<nav class="pagination" aria-label="{{ i18n "pagination" }}">{{ if .HasPrev }}<a href="{{ .Prev.URL }}" aria-label="{{ i18n "previous" }}">←</a>{{ end }}{{ range .Pagers }}<a class="{{ if eq .PageNumber $.Paginator.PageNumber }}is-active{{ end }}" href="{{ .URL }}">{{ .PageNumber }}</a>{{ end }}{{ if .HasNext }}<a href="{{ .Next.URL }}" aria-label="{{ i18n "next" }}">→</a>{{ end }}</nav>{{ end }}{{ end }}
