<section class="cta-section"><div class="container cta-section__inner"><div><span class="eyebrow">{{ .eyebrow | default site.Home.Params.cta.eyebrow }}</span><h2>{{ .title | default site.Home.Params.cta.title }}</h2><p>{{ .description | default site.Home.Params.cta.description }}</p></div><a class="button button--light" href="{{ .buttonUrl | default site.Home.Params.cta.buttonUrl | relLangURL }}">{{ .buttonLabel | default site.Home.Params.cta.buttonLabel }} <span>↗</span></a></div></section>
