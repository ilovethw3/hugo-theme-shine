{{ $page := .page }}
{{ $items := $page.Params.faq }}
{{ with $items }}
  <section class="section faq-section">
    <div class="container container--narrow">
      <div class="faq-list">
        {{ range $index, $item := . }}
          <details class="faq-item"{{ if eq $index 0 }} open{{ end }}>
            <summary>
              <span>{{ $item.question }}</span>
              <span class="faq-item__icon" aria-hidden="true">+</span>
            </summary>
            <div class="prose faq-item__answer">{{ $item.answer | markdownify }}</div>
          </details>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
