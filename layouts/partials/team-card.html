<article class="team-card"><div class="team-card__media"><img src="{{ .Params.photo | default (site.Params.brand.placeholderImage | default "/images/placeholder.svg") | relURL }}" alt="{{ .Title }}" loading="lazy"></div><div class="team-card__body"><h3>{{ .Title }}</h3><span>{{ .Params.role }}</span><div class="team-card__summary">{{ .Params.summary | markdownify }}</div></div></article>
