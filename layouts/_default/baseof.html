<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="page-{{ .Kind }} section-{{ .Section | default "home" }}">
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
  </body>
</html>
