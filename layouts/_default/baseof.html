<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="page-{{ .Kind }} section-{{ .Section | default "home" }}{{ if .Params.landing }} page-landing{{ end }}" data-analytics-content="{{ .Params.product | default .Params.analyticsContent | default "" }}">
    {{ if ne .Params.showSiteHeader false }}{{ partial "header.html" . }}{{ end }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ if ne .Params.showSiteFooter false }}{{ partial "footer.html" . }}{{ end }}
    {{ partial "analytics.html" . }}
    {{ partial "scripts.html" . }}
  </body>
</html>
