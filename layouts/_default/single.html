{{ define "main" }}
  {{ partial "page-hero.html" . }}
  <article class="section article-section">
    <div class="container container--narrow">
      {{ with .Params.cover }}
        {{ $cover := . | relURL }}
        {{ with $.Resources.GetMatch . }}{{ $cover = .RelPermalink }}{{ end }}
        <img class="article-cover" src="{{ $cover }}" alt="{{ $.Params.coverAlt | default $.Title }}" loading="lazy">
      {{ end }}
      <div class="prose">{{ .Content }}</div>
    </div>
  </article>
{{ end }}
