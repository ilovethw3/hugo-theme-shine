{{ define "main" }}
  {{ partial "page-hero.html" . }}
  <section class="section section-list">
    <div class="container">
      {{ with .Content }}<div class="prose page-intro">{{ . }}</div>{{ end }}
      <div class="card-grid card-grid--three">
        {{ range .Pages }}{{ partial "content-card.html" . }}{{ else }}<p class="empty-state">{{ i18n "noContent" }}</p>{{ end }}
      </div>
      {{ partial "pagination.html" . }}
    </div>
  </section>
{{ end }}
